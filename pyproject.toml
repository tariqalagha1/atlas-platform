[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-platform"
version = "0.1.0-alpha"
description = "Atlas Enterprise AI Operating System"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name = "Tariq Alagha"}
]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["atlas*"]

[project.scripts]
atlasctl = "atlas.cli.main:main"
